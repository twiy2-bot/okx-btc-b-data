name: Download OKX BTC B Sample
on:
  workflow_dispatch:
    inputs:
      redownload_bad:
        description: "断点中自检不合格的分片也重新下载"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: download-b-data
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  CKPT_KEY_PREFIX: b-ckpt-v2-${{ hashFiles('脚本/下载B样本.py') }}-
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests==2.32.3
      - name: Offline tests
        run: python 脚本/测试_下载B样本.py
      - name: Restore checkpoint
        uses: actions/cache/restore@v4
        with:
          path: 输出/断点
          key: ${{ env.CKPT_KEY_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.CKPT_KEY_PREFIX }}
      - name: Download and audit B sample
        env:
          REDOWNLOAD_BAD: ${{ inputs.redownload_bad }}
        run: |
          args=(--output 输出)
          if [ "$REDOWNLOAD_BAD" = "true" ]; then
            args+=(--redownload-bad)
          fi
          python 脚本/下载B样本.py "${args[@]}"
      - name: Save checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: 输出/断点
          key: ${{ env.CKPT_KEY_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload deliverables and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OKX-B-Sample-2020-2024-run${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            输出/交付/
            输出/日志/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OKX-B-Raw-run${{ github.run_number }}-${{ github.run_attempt }}
          path: 输出/断点/
          if-no-files-found: warn
          retention-days: 30